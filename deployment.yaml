apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      imagePullSecrets:
      - name: ecr-secret

      containers:
      - name: nodejs-app
        image: 629614691743.dkr.ecr.eu-north-1.amazonaws.com/nodejs-app:latest
        ports:
        - containerPort: 3000